<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cycle Lab: The 28-Day Female Sexual Cycle</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f8;--card:#fff;--ink:#14232f;--muted:#5b6b78;--line:#d9e2e8;
  --navy:#1d3a52;--teal:#0f7c7a;--teal-soft:#e2f3f2;
  --fsh:#2f6fd0;--lh:#d0612f;--e2:#b0479a;--p4:#c99a12;--hcg:#14a39a;--endo:#c8505a;
  --good:#1f8a4c;--good-soft:#e5f5ec;--bad:#b8392f;--bad-soft:#fbe9e7;--amber:#b9770e;--amber-soft:#fdf3e1;
}
*{box-sizing:border-box}
body{margin:0;font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
button,select,input{font:inherit}
button{cursor:pointer}
.wrap{max-width:1060px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
header h1{margin:0;font-size:1.35rem}
header p{margin:0;color:var(--muted);font-size:.9rem}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.88rem}
.chip b{font-family:"DM Mono",monospace}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
nav button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:500;color:var(--ink)}
nav button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h2{margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 14px}
.btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn.sm{padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lab{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px}
@media(max-width:820px){.lab{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fbfcfd}
.panel h4{margin:0 0 4px;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:12px;font-size:.8rem;text-transform:none;letter-spacing:0;font-weight:500}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
svg{width:100%;height:auto;display:block}
.slider{display:flex;align-items:center;gap:10px;margin:8px 0 12px}
.slider input{flex:1;accent-color:var(--navy)}
.daybig{font-family:"DM Mono",monospace;font-size:1.5rem;font-weight:500;min-width:84px}
.phasebar{display:flex;gap:4px;margin:4px 0 10px;flex-wrap:wrap}
.ph{border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--muted)}
.ph.on{color:#fff}
.readout{display:grid;gap:8px}
.ro{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ro b{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ro span{font-size:.95rem}
.why{background:var(--teal-soft);border-left:4px solid var(--teal);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.95rem}
.scen{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.scen button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.88rem;color:var(--ink)}
.scen button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.callout{background:var(--amber-soft);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.95rem}
.callout b{color:var(--amber)}
/* sort */
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:12px;background:#fafcfd;min-height:56px}
.tile{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px;font-weight:500;color:var(--ink);text-align:left;font-size:.92rem}
.tile.sel{border-color:var(--navy);background:var(--navy);color:#fff}
.tile.ok{border-color:var(--good);background:var(--good-soft)}
.tile.no{border-color:var(--bad);background:var(--bad-soft)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px}
.bin{border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff;min-height:130px;text-align:left;color:var(--ink)}
.bin.ready{border-style:dashed;border-color:var(--navy);background:#f1f5f9}
.bin h3{margin:0 0 2px;font-size:1rem}
.bin p{margin:0 0 8px;color:var(--muted);font-size:.82rem}
.bin .tiles{display:flex;flex-direction:column;gap:6px}
.bin .tile{font-size:.86rem;padding:5px 10px}
/* quiz */
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--teal);background:var(--teal-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{display:none;margin-top:12px;border-radius:10px;padding:12px 14px}
.fb.show{display:block}.fb.good{background:var(--good-soft)}.fb.bad{background:var(--bad-soft)}
.fb h4{margin:0 0 4px}
.ref{font-family:"DM Mono",monospace;font-size:.78rem;color:var(--muted);margin-top:6px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.progress>div{height:100%;background:var(--teal);transition:width .3s}
.qbox{background:#f6f9fb;border-radius:10px;padding:12px 14px}
.muted{color:var(--muted)}.small{font-size:.88rem}
.tag{font-family:"DM Mono",monospace;font-size:.72rem;background:var(--amber-soft);color:var(--amber);border-radius:6px;padding:2px 6px;margin-left:6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Cycle Lab: The 28-Day Sexual Cycle</h1><p>Pituitary → ovary → uterus · Saladin A&amp;P 10e, Chapter 28 (Fig. 28.13)</p></div>
  <div class="chip">Score <b id="score">0</b></div>
</header>
<nav id="tabs" role="tablist"></nav>
<main id="view"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= MODEL ================= */
// Schematic curves (0-100 relative units), keypoints by day. Simplified teaching curves, not measured data.
const BASE = {
  FSH:[[1,40],[4,48],[8,30],[11,24],[12,32],[13,48],[14,55],[15,30],[18,18],[24,15],[26,25],[28,38]],
  LH: [[1,15],[8,15],[11,20],[12,40],[13,92],[14,100],[15,40],[17,18],[25,12],[28,14]],
  E2: [[1,10],[7,15],[9,25],[12,80],[13,95],[14,60],[16,40],[21,62],[24,55],[26,28],[28,12]],
  P4: [[1,4],[13,5],[14,10],[17,50],[21,90],[23,84],[25,55],[27,15],[28,6]],
  ENDO:[[1,4.5],[3,2.2],[5,0.5],[10,1.8],[14,3],[18,4.5],[22,5.6],[26,6],[27,5.4],[28,4.6]],
  HCG:[[1,0],[28,0]]
};
const SCEN = {
  normal:{label:"Normal cycle", desc:"No pregnancy. The corpus luteum degenerates, hormones fall, and the functional layer is shed."},
  preg:{label:"Pregnancy", desc:"Fertilization around day 14–15 and implantation about a week later. The blastocyst secretes hCG, which rescues the corpus luteum, so estrogen and progesterone stay high and there is no menstruation."},
  pill:{label:"Combined pill", desc:"Synthetic estrogen and progestin keep FSH and LH suppressed by negative feedback. Follicles don't mature, there is no LH surge, and there is no ovulation."},
  meno:{label:"Menopause", desc:"Follicles are nearly gone and the few left respond poorly. Estrogen and progesterone are low, so negative feedback is lost and FSH and LH stay high. No ovulation, no menstruation."},
  leptin:{label:"Very low body fat", desc:"Leptin, the brain's fat signal, is too low, so GnRH isn't secreted. FSH and LH stay low, follicles don't develop, and menstruation stops (amenorrhea)."}
};
function curves(sc){
  const c = JSON.parse(JSON.stringify(BASE));
  if(sc==="preg"){
    c.HCG=[[1,0],[20,0],[22,8],[24,30],[26,55],[28,80]];
    c.E2=[[1,10],[7,15],[9,25],[12,80],[13,95],[14,60],[16,40],[21,62],[24,70],[28,82]];
    c.P4=[[1,4],[13,5],[14,10],[17,50],[21,90],[24,95],[28,100]];
    c.FSH=[[1,40],[4,48],[8,30],[11,24],[12,32],[13,48],[14,55],[15,30],[18,18],[28,10]];
    c.LH=[[1,15],[8,15],[11,20],[12,40],[13,92],[14,100],[15,40],[17,18],[28,8]];
    c.ENDO=[[1,4.5],[3,2.2],[5,0.5],[10,1.8],[14,3],[18,4.5],[22,5.6],[28,6.5]];
  }
  if(sc==="pill"){
    c.FSH=[[1,12],[28,12]]; c.LH=[[1,10],[28,10]]; c.E2=[[1,8],[28,8]]; c.P4=[[1,4],[28,4]];
    c.ENDO=[[1,2],[3,1.2],[5,0.7],[28,1.4]];
  }
  if(sc==="meno"){
    c.FSH=[[1,92],[28,92]]; c.LH=[[1,78],[28,78]]; c.E2=[[1,5],[28,5]]; c.P4=[[1,2],[28,2]];
    c.ENDO=[[1,0.5],[28,0.5]];
  }
  if(sc==="leptin"){
    c.FSH=[[1,8],[28,8]]; c.LH=[[1,6],[28,6]]; c.E2=[[1,5],[28,5]]; c.P4=[[1,2],[28,2]];
    c.ENDO=[[1,0.5],[28,0.5]];
  }
  return c;
}
function val(pts,d){ for(let i=0;i<pts.length-1;i++){const[a,va]=pts[i],[b,vb]=pts[i+1]; if(d>=a&&d<=b) return va+(vb-va)*(d-a)/(b-a);} return pts[pts.length-1][1]; }

function ovaryState(d,sc){
  if(sc==="meno") return {k:"none",t:"Few or no follicles left; no follicle develops"};
  if(sc==="pill"||sc==="leptin") return {k:"small",t:"Small follicles only; none matures (no FSH/LH drive)"};
  if(d<=5) return {k:"grow",r:6+d,t:"Cohort of follicles growing under FSH (primary → secondary)"};
  if(d<=11) return {k:"grow",r:10+d*1.6,t:d>=7?"One dominant follicle captures FSH; the rest undergo atresia":"Tertiary (antral) follicles secreting estradiol"};
  if(d<=13) return {k:"grow",r:30+d,t:"Preovulatory (graafian) follicle bulges from the ovary; LH surge"};
  if(d===14) return {k:"ovul",t:"OVULATION: follicle ruptures and the secondary oocyte is released"};
  if(sc==="preg") return {k:"cl",r:Math.min(30,18+(d-14)*1.4),t:d<21?"Corpus luteum secretes progesterone and estrogen":"hCG from the blastocyst keeps the corpus luteum alive and enlarging"};
  if(d<=21) return {k:"cl",r:18+(d-14)*1.5,t:"Corpus luteum (yellow) secretes progesterone and estrogen"};
  if(d<=25) return {k:"cl",r:28-(d-21)*3,fade:(d-21)/5,t:"Corpus luteum involutes (shrinks) from about day 22"};
  return {k:"alb",t:"Corpus albicans (white scar) remains; new cohort of follicles stirs as FSH rises"};
}
function ovPhase(d,sc){ if(sc!=="normal"&&sc!=="preg") return "No cycle"; return d<14?"Follicular":d===14?"Ovulation":"Luteal"; }
function utPhase(d,sc){
  if(sc==="meno"||sc==="leptin") return "Inactive (thin endometrium)";
  if(sc==="pill") return "Thin, inactive endometrium";
  if(sc==="preg" && d>=15) return "Secretory → maintained for implantation";
  return d<=5?"Menstrual":d<=14?"Proliferative":d<=26?"Secretory":"Premenstrual (ischemic)";
}
function uterusText(d,sc){
  if(sc==="meno") return "Thin and atrophic. Without estrogen the functional layer doesn't regrow.";
  if(sc==="leptin") return "Thin. Without estrogen no functional layer builds, so there are no periods (amenorrhea).";
  if(sc==="pill") return "Stays thin because the body's own estrogen surge never happens.";
  if(sc==="preg"&&d>=15) return d>=21?"Progesterone keeps the thick, glycogen-rich endometrium in place for the implanted blastocyst. No menstruation.":"Progesterone makes the glands secrete glycogen, building a nutritious bed.";
  if(d<=5) return "The functional layer is shed (about 40 mL of blood plus serous fluid). By day 5 only the basal layer is left (≈0.5 mm).";
  if(d<=14) return "Estrogen stimulates mitosis in the basal layer, which regrows the functional layer (2–3 mm by day 14) and adds progesterone receptors.";
  if(d<=26) return "Progesterone makes the glands secrete glycogen and coil. The endometrium reaches 5–6 mm, a soft, wet, nutritious bed.";
  return "Progesterone falls, so the spiral arteries spasm. Ischemia kills the functional layer, which causes cramps.";
}
function whyText(d,sc){
  if(sc!=="normal") return SCEN[sc].desc;
  if(d<=5) return "Low estrogen and progesterone at the end of the last cycle lifted negative feedback, so FSH rises and recruits a new cohort of follicles.";
  if(d<=11) return "FSH stimulates follicles to grow and secrete estradiol. Estradiol rebuilds the endometrium. Inhibin and estrogen begin to hold FSH down, so only the dominant follicle keeps going.";
  if(d<=14) return "High estradiol now triggers the anterior pituitary's LH surge (with a smaller FSH spike). The LH surge causes ovulation.";
  if(d<=21) return "LH turns the ruptured follicle into the corpus luteum, which secretes lots of progesterone (and estrogen). Together they inhibit FSH and LH by negative feedback.";
  if(d<=26) return "With no pregnancy (no hCG), the corpus luteum involutes. Progesterone and estrogen begin to fall.";
  return "Progesterone withdrawal triggers spiral-artery spasms and menstruation. With feedback removed, FSH rises again and the cycle restarts.";
}

/* ================= DRAWING ================= */
const W=520,H=120,PADL=28,PADR=10,PADT=8,PADB=18;
const xd=d=>PADL+(d-1)*(W-PADL-PADR)/27;
function chart(series,max,day,yLabel,bands=true){
  const yv=v=>PADT+(H-PADT-PADB)*(1-v/max);
  let g="";
  if(bands){ g+=`<rect x="${xd(1)}" y="${PADT}" width="${xd(5)-xd(1)}" height="${H-PADT-PADB}" fill="#c8505a" opacity=".07"/>`; }
  for(let d=1;d<=28;d+=(d===1?6:7)){ g+=`<line x1="${xd(d)}" x2="${xd(d)}" y1="${PADT}" y2="${H-PADB}" stroke="#e3e9ee"/><text x="${xd(d)}" y="${H-4}" font-size="9" text-anchor="middle" fill="#8a98a5">${d}</text>`; }
  g+=`<line x1="${xd(28)}" x2="${xd(28)}" y1="${PADT}" y2="${H-PADB}" stroke="#e3e9ee"/><text x="${xd(28)}" y="${H-4}" font-size="9" text-anchor="middle" fill="#8a98a5">28</text>`;
  g+=`<line x1="${PADL}" x2="${W-PADR}" y1="${H-PADB}" y2="${H-PADB}" stroke="#c9d3db"/>`;
  g+=`<text x="4" y="${PADT+8}" font-size="9" fill="#8a98a5">${yLabel}</text>`;
  for(const s of series){
    const pts=[];for(let d=1;d<=28;d+=0.25)pts.push(`${xd(d).toFixed(1)},${yv(val(s.pts,d)).toFixed(1)}`);
    g+=`<polyline points="${pts.join(" ")}" fill="none" stroke="${s.c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
    g+=`<circle cx="${xd(day)}" cy="${yv(val(s.pts,day))}" r="5" fill="${s.c}" stroke="#fff" stroke-width="2"/>`;
  }
  g+=`<line x1="${xd(day)}" x2="${xd(day)}" y1="${PADT}" y2="${H-PADB}" stroke="#1d3a52" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${yLabel} chart">${g}</svg>`;
}
function ovarySVG(d,sc){
  const o=ovaryState(d,sc);
  let inner="";
  // background small follicles
  const smalls=[[70,40],[95,85],[150,95],[185,45],[60,70]];
  if(o.k!=="none") smalls.forEach(([x,y])=>inner+=`<circle cx="${x}" cy="${y}" r="5" fill="#fff3d6" stroke="#e4c27a" stroke-width="1.5"/>`);
  if(o.k==="grow"){
    const r=Math.min(o.r,40)*0.75;
    inner+=`<circle cx="135" cy="60" r="${r}" fill="#fff6e6" stroke="#e0a23a" stroke-width="3"/>`;
    if(r>12) inner+=`<circle cx="${135-r*0.45}" cy="${60-r*0.2}" r="${Math.max(4,r*0.28)}" fill="#f7d7a8" stroke="#c48a2a" stroke-width="2"/><circle cx="${135-r*0.45}" cy="${60-r*0.2}" r="${Math.max(2,r*0.12)}" fill="#8b5a1a"/>`;
    else inner+=`<circle cx="135" cy="60" r="3" fill="#8b5a1a"/>`;
  }
  if(o.k==="ovul"){
    inner+=`<path d="M165 40 q12 -6 18 4 q-6 10 -18 6z" fill="#fff6e6" stroke="#e0a23a" stroke-width="3"/>`;
    inner+=`<circle cx="214" cy="26" r="9" fill="#f7d7a8" stroke="#c48a2a" stroke-width="2"/><circle cx="214" cy="26" r="4" fill="#8b5a1a"/>`;
    inner+=`<path d="M186 40 L204 30" stroke="#c48a2a" stroke-width="2" stroke-dasharray="3 3"/><text x="196" y="58" font-size="10" fill="#8b5a1a">oocyte</text>`;
  }
  if(o.k==="cl"){
    const op=1-(o.fade||0)*0.7;
    inner+=`<circle cx="140" cy="60" r="${o.r*0.85}" fill="#f2c53d" opacity="${op}" stroke="#c99a12" stroke-width="2.5"/><text x="140" y="64" font-size="10" text-anchor="middle" fill="#6b4e00" font-weight="700">CL</text>`;
  }
  if(o.k==="alb"){
    inner+=`<circle cx="140" cy="60" r="10" fill="#f4f1ea" stroke="#bdb3a0" stroke-width="2"/><text x="140" y="85" font-size="10" text-anchor="middle" fill="#7a6f5c">albicans</text>`;
  }
  return `<svg viewBox="0 0 260 120" role="img" aria-label="Schematic ovary: ${o.t}">
    <ellipse cx="128" cy="62" rx="100" ry="52" fill="#f6dccd" stroke="#d9a58c" stroke-width="3"/>${inner}</svg>`;
}
function uterusSVG(d,sc,c){
  const mm=val(c.ENDO,d); const th=6+mm*7; // px
  const shedding = (sc==="normal"||sc==="preg") && d<=5 && !(sc==="preg"&&d>14);
  const isch = sc==="normal" && d>=27;
  const col = isch?"#9e3a46":shedding?"#b5404e":"#e58a92";
  const drops = shedding?`<circle cx="130" cy="112" r="3" fill="#b5404e"/><circle cx="124" cy="104" r="2.4" fill="#b5404e"/><circle cx="136" cy="100" r="2" fill="#b5404e"/>`:"";
  return `<svg viewBox="0 0 260 120" role="img" aria-label="Endometrium ${mm.toFixed(1)} millimeters thick">
    <path d="M60 14 Q130 0 200 14 L176 92 Q130 104 84 92 Z" fill="#e9b7a7" stroke="#c98a77" stroke-width="3"/>
    <path d="M80 26 Q130 16 180 26 L162 82 Q130 90 98 82 Z" fill="${col}" />
    <ellipse cx="130" cy="54" rx="${Math.max(4,48-mm*6.5)}" ry="${Math.max(2,26-mm*3.8)}" fill="#fff4f2"/>
    <rect x="124" y="90" width="12" height="16" fill="#e9b7a7"/>${drops}
    <text x="206" y="50" font-size="11" fill="#5b6b78">${mm.toFixed(1)} mm</text>
  </svg>`;
}

/* ================= STATE / UI ================= */
let score=0, tab="explore", day=1, sc="normal", playing=null;
const $=s=>document.querySelector(s);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function addScore(n){score+=n;$("#score").textContent=score}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800)}
const TABS=[["explore","1 · Explore the Cycle"],["whatif","2 · What If…?"],["sort","3 · Phase Sort"],["quiz","4 · Day Detective"]];
function renderTabs(){ $("#tabs").innerHTML=TABS.map(([id,l])=>`<button role="tab" aria-selected="${id===tab}" data-t="${id}">${l}</button>`).join("");
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{stop();tab=b.dataset.t;renderTabs();route()});}
function route(){({explore:()=>{sc="normal";viewLab(false)},whatif:()=>viewLab(true),sort:viewSort,quiz:viewQuiz})[tab]()}
function stop(){clearInterval(playing);playing=null}

/* ================= 1 & 2 · LAB ================= */
function viewLab(whatif){
  $("#view").innerHTML=`<div class="card">
   <h2>${whatif?"What if…?":"Explore the cycle"}</h2>
   <p class="lead">${whatif?"Change one thing and watch the whole cycle respond. Every scenario is the same feedback system with one link changed.":"Drag the slider (or press play) to move through a typical 28-day cycle. All four levels, pituitary → ovary → ovarian hormones → uterus, move together. Watch what causes what."}</p>
   ${whatif?`<div class="scen" role="group" aria-label="Scenario">${Object.entries(SCEN).map(([k,v])=>`<button aria-pressed="${sc===k}" data-sc="${k}">${v.label}</button>`).join("")}</div>`:''}
   <div class="slider"><span class="daybig" id="dayLbl">Day ${day}</span>
     <input type="range" min="1" max="28" value="${day}" id="dayIn" aria-label="Cycle day">
     <button class="btn sm" id="play">▶ Play</button></div>
   <div class="phasebar" id="phasebar"></div>
   <div class="lab">
     <div id="charts"></div>
     <div class="readout" id="readout"></div>
   </div>
   ${!whatif?`<div class="callout"><b>Read it top-down:</b> the hypothalamus (GnRH) drives the pituitary (FSH, LH), which drives the ovary (follicle, corpus luteum), which secretes estradiol and progesterone, which remodel the uterus. The ovarian hormones then feed back on the hypothalamus and pituitary.</div>`:''}
  </div>`;
  if(whatif) document.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{sc=b.dataset.sc;if(sc!=="normal"&&sc!=="preg")day=Math.max(day,1);viewLab(true)});
  $("#dayIn").oninput=e=>{day=+e.target.value;drawLab()};
  $("#play").onclick=()=>{ if(playing){stop();$("#play").textContent="▶ Play";return}
    $("#play").textContent="⏸ Pause"; playing=setInterval(()=>{day=day>=28?1:day+1;$("#dayIn").value=day;drawLab()},650)};
  drawLab();
}
function drawLab(){
  const c=curves(sc);
  $("#dayLbl").textContent="Day "+day;
  const phases=[["Menstrual",1,5,"#c8505a"],["Proliferative",6,14,"#d0612f"],["Secretory",15,26,"#c99a12"],["Premenstrual",27,28,"#7c3e8f"]];
  const live=(sc==="normal"||sc==="preg");
  $("#phasebar").innerHTML = `<span class="ph on" style="background:${live?(day<14?'#2f6fd0':day===14?'#d0612f':'#c99a12'):'#8a98a5'};border-color:transparent">Ovary: ${ovPhase(day,sc)}</span>`+
    `<span class="ph on" style="background:${live?(phases.find(p=>day>=p[1]&&day<=p[2])[3]):'#8a98a5'};border-color:transparent">Uterus: ${utPhase(day,sc)}</span>`;
  const gon=[{pts:c.FSH,c:"var(--fsh)"},{pts:c.LH,c:"var(--lh)"}];
  const ovh=[{pts:c.E2,c:"var(--e2)"},{pts:c.P4,c:"var(--p4)"}];
  if(sc==="preg") ovh.push({pts:c.HCG,c:"var(--hcg)",dash:true});
  $("#charts").innerHTML=`
   <div class="panel"><h4>Pituitary gonadotropins<span class="legend"><span><i style="background:var(--fsh)"></i>FSH</span><span><i style="background:var(--lh)"></i>LH</span></span></h4>${chart(gon,105,day,"level")}</div>
   <div class="panel"><h4>Ovarian hormones<span class="legend"><span><i style="background:var(--e2)"></i>Estradiol</span><span><i style="background:var(--p4)"></i>Progesterone</span>${sc==="preg"?'<span><i style="background:var(--hcg)"></i>hCG</span>':''}</span></h4>${chart(ovh,105,day,"level")}</div>
   <div class="panel"><h4>Endometrial thickness<span class="legend"><span><i style="background:var(--endo)"></i>mm</span></span></h4>${chart([{pts:c.ENDO,c:"var(--endo)"}],7,day,"mm")}</div>
   <p class="small muted" style="margin:0">Curves are simplified teaching sketches, not lab values. The shaded band shows days 1–5.</p>`;
  const o=ovaryState(day,sc);
  $("#readout").innerHTML=`
   <div class="ro"><b>Ovary</b>${ovarySVG(day,sc)}<span>${o.t}</span></div>
   <div class="ro"><b>Uterus (endometrium)</b>${uterusSVG(day,sc,c)}<span>${uterusText(day,sc)}</span></div>
   <div class="why"><b>Why?</b> ${whyText(day,sc)}</div>`;
}

/* ================= 3 · SORT ================= */
const SORT_BINS=[
 {id:"men",name:"Menstrual phase",sub:"Days 1–5"},
 {id:"pro",name:"Proliferative phase",sub:"Days 6–14 · follicular"},
 {id:"ovu",name:"Ovulation",sub:"≈ Day 14"},
 {id:"sec",name:"Secretory phase",sub:"Days 15–26 · luteal"},
 {id:"pre",name:"Premenstrual (ischemic)",sub:"Days 27–28"}];
const SORT_ITEMS=[
 ["Functional layer is shed; only the basal layer remains","men"],
 ["FSH rises as last cycle's negative feedback is lifted","men"],
 ["Estrogen stimulates mitosis in the basal layer","pro"],
 ["Dominant follicle captures FSH; others undergo atresia","pro"],
 ["Endometrial cells make progesterone receptors","pro"],
 ["LH surge with a smaller FSH spike","ovu"],
 ["Follicle ruptures and releases the secondary oocyte","ovu"],
 ["Corpus luteum secretes progesterone","sec"],
 ["Endometrial glands secrete glycogen and coil","sec"],
 ["Endometrium reaches 5–6 mm","sec"],
 ["Spiral arteries spasm, causing ischemia","pre"],
 ["Progesterone falls as the corpus luteum becomes the corpus albicans","pre"]];
let placed={}, sel=null, checked=false, order=null;
function viewSort(){placed={};sel=null;checked=false;order=shuffle(SORT_ITEMS.map(x=>x[0]));renderSort()}
function renderSort(){
  const un=order.filter(t=>!placed[t]);
  $("#view").innerHTML=`<div class="card"><h2>Phase Sort</h2>
   <p class="lead">Each event happens in one phase. <b>Tap an event, then tap its phase.</b> Tap a placed event to move it back.</p>
   <div class="bank">${un.map(t=>`<button class="tile ${sel===t?'sel':''}" data-n="${t}">${t}</button>`).join("")||'<span class="muted small">All sorted. Check your work!</span>'}</div>
   <div class="bins">${SORT_BINS.map(b=>`<button class="bin ${sel?'ready':''}" data-b="${b.id}"><h3>${b.name}</h3><p>${b.sub}</p>
     <div class="tiles">${SORT_ITEMS.filter(([t])=>placed[t]===b.id).map(([t,a])=>`<span class="tile ${checked?(a===b.id?'ok':'no'):''}" data-back="${t}">${t}</span>`).join("")}</div></button>`).join("")}</div>
   <div class="row" style="margin-top:14px"><button class="btn" id="chk" ${un.length||checked?'disabled':''}>Check</button><button class="btn ghost" id="rst">Reset</button></div>
   <div class="fb" id="fb"></div></div>`;
  document.querySelectorAll("[data-n]").forEach(t=>t.onclick=()=>{sel=sel===t.dataset.n?null:t.dataset.n;renderSort()});
  document.querySelectorAll("[data-b]").forEach(b=>b.onclick=e=>{
    const back=e.target.closest("[data-back]");
    if(back&&!checked){delete placed[back.dataset.back];renderSort();return}
    if(sel&&!checked){placed[sel]=b.dataset.b;sel=null;renderSort()} else if(!checked) toast("Tap an event first");
  });
  $("#rst").onclick=viewSort;
  $("#chk").onclick=()=>{checked=true;const r=SORT_ITEMS.filter(([t,a])=>placed[t]===a).length;addScore(r*3);renderSort();
    const fb=$("#fb");fb.className="fb show "+(r===SORT_ITEMS.length?"good":"bad");
    fb.innerHTML=`<h4>${r}/${SORT_ITEMS.length} correct${r===SORT_ITEMS.length?" 🎉":""}</h4><div class="small">Red tiles are in the wrong phase. The pattern to remember: <b>estrogen builds</b> the endometrium (proliferative), <b>progesterone ripens</b> it (secretory), and <b>progesterone withdrawal destroys</b> it (premenstrual → menstrual).</div>
     <div class="ref">Slides 60–73 · 28.3c The Sexual Cycle</div>`;};
}

/* ================= 4 · QUIZ ================= */
const QUIZ=[
 {day:8,sc:"normal",q:"Look at the panels. What day range is this, and which hormone is rebuilding the endometrium?",
  o:["Days 6–14; estrogen","Days 15–26; progesterone","Days 1–5; FSH","Days 27–28; LH"],a:0,
  ex:"Follicles are growing and estradiol is rising, so this is the proliferative (follicular) phase. Estrogen stimulates mitosis in the basal layer.",ref:"Slide 70"},
 {day:14,sc:"normal",q:"LH is at its peak. What happens next?",
  o:["Menstruation begins","The mature follicle ruptures and releases the oocyte (ovulation)","The corpus albicans forms","FSH recruits a new cohort"],a:1,
  ex:"The LH surge (triggered by high estradiol) causes ovulation, and meiosis I finishes that day, making a secondary oocyte.",ref:"Slides 50, 63–65"},
 {day:21,sc:"normal",q:"Progesterone is highest now. Where is it coming from?",
  o:["The dominant follicle","The corpus luteum","The anterior pituitary","The endometrium"],a:1,
  ex:"After ovulation, LH converts the ruptured follicle into the corpus luteum, which secretes progesterone and estrogen.",ref:"Slide 66"},
 {day:27,sc:"normal",q:"Why does menstruation start in a day or two?",
  o:["An estrogen surge thins the lining","Falling progesterone makes the spiral arteries spasm, causing ischemia and death of the functional layer","LH directly digests the endometrium","The basal layer is shed"],a:1,
  ex:"Without pregnancy the corpus luteum involutes. Progesterone withdrawal leads to spiral-artery spasms and ischemia, and the functional layer dies and is shed. The basal layer stays.",ref:"Slides 67, 72"},
 {day:3,sc:"normal",q:"Why is FSH rising at the very start of a new cycle?",
  o:["Positive feedback from progesterone","Estrogen and progesterone fell at the end of the last cycle, removing negative feedback on the pituitary","hCG stimulates the pituitary","Menstrual fluid contains FSH"],a:1,
  ex:"As the corpus luteum degenerates, estrogen and progesterone drop, so the pituitary is no longer inhibited and FSH rises to start a new cohort.",ref:"Slide 67"},
 {day:26,sc:"preg",q:"In this pregnant cycle, why are progesterone and estrogen still rising instead of falling?",
  o:["The pituitary's LH surge repeats","hCG from the blastocyst rescues the corpus luteum","The endometrium secretes progesterone","FSH stimulates a second ovulation"],a:1,
  ex:"hCG is secreted by the blastocyst and placenta, and home pregnancy tests detect it 8–9 days after conception. It keeps the corpus luteum secreting progesterone and estrogen, so the endometrium isn't shed.",ref:"Slides 85–86"},
 {day:14,sc:"pill",q:"A patient takes a combined (estrogen + progestin) pill. Why is there no ovulation?",
  o:["The pill destroys oocytes","FSH and LH are suppressed by negative feedback, so follicles don't mature and there's no LH surge","The pill blocks the uterine tubes","The pill raises LH continuously"],a:1,
  ex:"Most hormonal methods prevent ovulation. Constant estrogen and progestin inhibit FSH and LH, so follicles don't mature.",ref:"Slide 125"},
 {day:10,sc:"meno",q:"After menopause, why are FSH and LH HIGH even though the ovaries are inactive?",
  o:["The pituitary is overactive from a tumor","With few follicles left, estrogen and progesterone are low, so negative feedback is lost","hCG stimulates them","Inhibin levels are high"],a:1,
  ex:"Climacteric begins when about 1,000 follicles remain. The follicles secrete less estrogen and progesterone, so the brake on FSH and LH is released.",ref:"Slides 43–44"},
 {day:10,sc:"leptin",q:"An athlete with very low body fat stops having periods. Which link in the chain is broken?",
  o:["Uterine progesterone receptors","Leptin is too low, so GnRH isn't secreted, and FSH and LH stay low","The cervix is blocked","The corpus luteum persists"],a:1,
  ex:"Leptin acts as an adiposity signal to the brain. If it's too low, GnRH isn't secreted, so the whole hypothalamo-pituitary-ovarian axis shuts down.",ref:"Slide 40"},
];
let qi=0,qr=0,deck=[];
function viewQuiz(){qi=0;qr=0;deck=QUIZ.map(q=>({...q,opts:shuffle(q.o.map((t,i)=>({t,i})))}));renderQ()}
function renderQ(){
  if(qi>=deck.length){
    const pct=Math.round(qr/deck.length*100);
    $("#view").innerHTML=`<div class="card"><h2>Results</h2><p style="font-size:1.1rem"><b>${qr}/${deck.length}</b> correct (${pct}%) · total score <b>${score}</b></p>
     <p class="muted">${pct>=85?"You can read Figure 28.13 like a clinician.":pct>=60?"Close. Replay the What If tab and follow the feedback arrows.":"Go back to Explore and press play. Watch which curve moves first."}</p>
     <div class="row"><button class="btn" id="again">Try again</button></div></div>`;
    $("#again").onclick=viewQuiz; return;
  }
  const q=deck[qi]; const c=curves(q.sc);
  const gon=[{pts:c.FSH,c:"var(--fsh)"},{pts:c.LH,c:"var(--lh)"}], ovh=[{pts:c.E2,c:"var(--e2)"},{pts:c.P4,c:"var(--p4)"}];
  if(q.sc==="preg") ovh.push({pts:c.HCG,c:"var(--hcg)",dash:true});
  $("#view").innerHTML=`<div class="card">
   <div class="row small muted" style="justify-content:space-between"><span>Case ${qi+1} of ${deck.length}</span><span>${qr} correct</span></div>
   <div class="progress"><div style="width:${qi/deck.length*100}%"></div></div>
   <div class="lab">
    <div>
     <div class="panel"><h4>Gonadotropins<span class="legend"><span><i style="background:var(--fsh)"></i>FSH</span><span><i style="background:var(--lh)"></i>LH</span></span></h4>${chart(gon,105,q.day,"level")}</div>
     <div class="panel"><h4>Ovarian hormones<span class="legend"><span><i style="background:var(--e2)"></i>E2</span><span><i style="background:var(--p4)"></i>P4</span>${q.sc==="preg"?'<span><i style="background:var(--hcg)"></i>hCG</span>':''}</span></h4>${chart(ovh,105,q.day,"level")}</div>
    </div>
    <div>
     <div class="qbox"><b>Scenario:</b> ${SCEN[q.sc].label}<br><span class="small muted">Day marker shown on the charts.</span></div>
     <p style="font-weight:700;margin:12px 0 0">${q.q}</p>
     <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-i="${o.i}">${String.fromCharCode(65+k)}. ${o.t}</button>`).join("")}</div>
     <div class="fb" id="fb"></div>
    </div>
   </div></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.i===q.a; if(ok){qr++;addScore(10)}
    document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add("right")}); if(!ok)b.classList.add("wrong");
    const fb=$("#fb");fb.className="fb show "+(ok?"good":"bad");
    fb.innerHTML=`<h4>${ok?"✅ Correct":"❌ Not quite"}</h4><div>${q.ex}</div><div class="ref">${q.ref}</div>
     <div class="row" style="margin-top:10px"><button class="btn" id="nq">${qi===deck.length-1?"See results":"Next →"}</button></div>`;
    $("#nq").onclick=()=>{qi++;renderQ()}; $("#nq").focus();
  });
}

renderTabs(); route();
</script>
